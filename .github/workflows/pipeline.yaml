name: Full CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ═══════════════════════════════════
  # STAGE 1: TEST
  # ═══════════════════════════════════
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm test
  # ═══════════════════════════════════
  # STAGE 2: BUILD & PUSH
  # ═══════════════════════════════════
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/myapp:latest
            ghcr.io/${{ github.repository }}/myapp:${{ github.sha }}
  # ═══════════════════════════════════
  # STAGE 3: DEPLOY (self-hosted)
  # ═══════════════════════════════════
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Minikube
        run: |
          echo "Updating deployment..."
          kubectl set image deployment/myapp \
            myapp=ghcr.io/${{ github.repository }}/myapp:${{ github.sha }} \
            -n myapp-prod

          echo "Waiting for rollout"
          kubectl rollout status deployment/myapp -n myapp-prod --timeout=120s

          echo "Deployed successfully"
          kubectl get pods -n myapp-prod
