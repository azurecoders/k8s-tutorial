apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-app
  namespace: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpa-app
  template:
    metadata:
      labels:
        app: hpa-app
    spec:
      containers:
        - name: hpa-app
          image: myapp:2.0
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: hpa-app-service
  namespace: development
spec:
  selector:
    app: hpa-app
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
