apiVersion: apps/v1
kind: Deployment
metadata:
  name: probes-app
  namespace: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probes-app
  template:
    metadata:
      labels:
        app: probes-app
    spec:
      containers:
        - name: probes-app
          image: myapp:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: APP_NAME
              value: "Probes Demo"

          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 1
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: probes-service
  namespace: development
spec:
  type: NodePort
  selector:
    app: probes-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30800
