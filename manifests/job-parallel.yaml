apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-job
  namespace: development
spec:
  completions: 5
  parallelism: 3
  template:
    spec:
      containers:
      - name: worker
        image: busybox
        command: ["sh",  "-c", 'echo "Worker $(hostname) processing..." && sleep 2 && echo echo "Done"']
      restartPolicy: Never
