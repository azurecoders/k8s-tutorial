apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: development
  labels:
    app: myapp
    environment: dev
    team: backend
    version: "2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
        environment: dev
        team: backend
        version: "2.0"
    spec:
      containers:
      - name: myapp
        image: myapp:1.0
        imagePullPolicy: Never
        ports:
          - containerPort: 3000
        env:
          - name: APP_NAME
            value: "MyApp-DEV"
          - name: ENVIRONMENT
            value: "development"
            
--- 

apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: development
spec:
  type: ClusterIP

  selector:
    app: myapp
  ports:
  - port: 80
    targetPort: 3000
