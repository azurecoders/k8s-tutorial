apiVersion: v1
kind: ServiceAccount
metadata:
  name: junior-dev
  namespace: development

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readonly-role
  namespace: development
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: junior-dev-readonly
  namespace: development
subjects:
  - kind: ServiceAccount
    name: junior-dev
    namespace: development
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: readonly-role
