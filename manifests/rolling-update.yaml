apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-app
  namespace: development
spec:
  replicas: 4
  selector:
    matchLabels:
      app: rolling-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: rolling-app
    spec:
      containers:
        - name: rolling-app
          image: myapp:2.0
          ports:
            - containerPort: 3000
          env:
            - name: APP_NAME
              value: "Version 2"

---
apiVersion: v1
kind: Service
metadata:
  name: rolling-app-service
  namespace: development
spec:
  type: NodePort
  selector:
    app: rolling-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30800
