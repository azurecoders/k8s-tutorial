apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-app
  namespace: myapp-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spread-app
  template:
    metadata:
      labels:
        app: spread-app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - spread-app
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: myapp:3.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 3000
          env:
            - name: APP_NAME
              value: "Spread App"
