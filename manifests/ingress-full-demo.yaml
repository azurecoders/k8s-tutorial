apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: website
          image: myapp:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: APP_NAME
              value: "Main Website"
            - name: ENVIRONEMTN
              value: "development"

---
apiVersion: v1
kind: Service
metadata:
  name: website-service
  namespace: development
spec:
  type: ClusterIP
  selector:
    app: website
  ports:
    - port: 80
      targetPort: 3000
      name: http

