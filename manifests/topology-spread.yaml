apiVersion: apps/v1
kind: Deployment
metadata:
  name: balanced-app
  namespace: myapp-prod
spec:
  replicas: 6
  selector:
    matchLabels:
      app: balanced-app
  template:
    metadata:
      labels:
        app: balanced-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: balanced-app
      containers:
        - name: app
          image: myapp:3.0
          imagePullPolicy: Never
          env:
            - name: APP_NAME
              value: "Balanced App"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
